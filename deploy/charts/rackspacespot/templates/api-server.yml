apiVersion: apps/v1
kind: Deployment
metadata:
  name: rackspacespot-api
  namespace: cattle-system
  labels:
    app: rackspacespot-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rackspacespot-api
  template:
    metadata:
      labels:
        app: rackspacespot-api
    spec:
      containers:
        - name: api
          image: {{ .Values.apiServer.image | quote }}
          args: ["serve-api", {{ .Values.apiServer.port | toString | quote }}]
          ports:
            - containerPort: {{ .Values.apiServer.port }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.apiServer.port }}
            initialDelaySeconds: 5
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: rackspacespot-api
  namespace: cattle-system
spec:
  selector:
    app: rackspacespot-api
  ports:
    - port: {{ .Values.apiServer.port }}
      targetPort: {{ .Values.apiServer.port }}
