apiVersion: catalog.cattle.io/v1
kind: UIPlugin
metadata:
  name: rackspacespot
  labels:
    app.kubernetes.io/name: rackspacespot
    app.kubernetes.io/version: {{ trimPrefix "v" .Chart.AppVersion | quote }}
spec:
  plugin:
    name: rackspacespot
    version: {{ trimPrefix "v" .Chart.AppVersion | quote }}
    endpoint: {{ default (printf "https://teamzuzu.github.io/rancher-rackspace-spot-driver/extensions/rackspacespot/%s" (trimPrefix "v" .Chart.AppVersion)) .Values.uiPlugin.endpoint | quote }}
    noCache: false
    noAuth: false
    metadata:
      catalog.cattle.io/display-name: Rackspace Spot
      catalog.cattle.io/rancher-version: ">= 2.10.0-0"
      catalog.cattle.io/ui-extensions-version: ">= 3.0.0 < 4.0.0"
