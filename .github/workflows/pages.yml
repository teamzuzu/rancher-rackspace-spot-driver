name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "ui/**"
      - "mkdocs.yml"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build docs + UI extension
    runs-on: [self-hosted, anchovy]
    steps:
      - uses: actions/checkout@v6

      # ── UI Extension ──────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc

      - name: Install yarn
        run: |
          npm install -g yarn
          echo "$(npm config get prefix)/bin" >> "$GITHUB_PATH"

      - name: Install UI dependencies
        working-directory: ui
        run: yarn install --frozen-lockfile

      - name: Build UI extension
        working-directory: ui
        run: yarn build-pkg rackspacespot

      - name: Copy extension bundle to docs/ui
        run: |
          mkdir -p docs/ui
          # build-pkg outputs to ui/dist-pkg/<name>-<version>/<name>-<version>.umd.min.js
          JS=$(find ui/dist-pkg -name '*.umd.min.js' 2>/dev/null | head -1)
          if [ -n "$JS" ]; then
            cp "$JS" docs/ui/component.js
            echo "Copied $JS → docs/ui/component.js"
          else
            echo "ERROR: could not locate built extension JS"; exit 1
          fi

      # ── MkDocs ───────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs and plugins
        run: |
          pip install --quiet \
            mkdocs-material==9.5.* \
            mkdocs-minify-plugin \
            mkdocs-git-revision-date-localized-plugin

      - name: Build site
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: [self-hosted, anchovy]
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
