name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - '*.md'

permissions:
  contents: read

env:
  CI_IMAGE: ghcr.io/${{ github.repository }}-ci:latest

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    container: ${{ env.CI_IMAGE }}
    steps:
      - uses: actions/checkout@v6

      - name: Generate go.sum
        run: go mod tidy

      - name: Format
        run: go fmt ./...

      - name: golangci-lint
        run: golangci-lint run --timeout=5m

  tidy:
    name: go mod tidy
    runs-on: ubuntu-latest
    container: ${{ env.CI_IMAGE }}
    steps:
      - uses: actions/checkout@v6

      - run: go mod tidy

      - name: Fail if go.mod changed
        run: |
          if ! git diff --quiet go.mod; then
            echo "go.mod is out of date — run 'go mod tidy' locally and commit go.mod"
            git diff go.mod
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    container: ${{ env.CI_IMAGE }}
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6

      - name: Generate go.sum
        run: go mod tidy

      - name: Build (${{ matrix.goarch }})
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags "-s -w" -o bin/kontainer-engine-driver-rackspacespot .

  test:
    name: Test
    runs-on: ubuntu-latest
    container: ${{ env.CI_IMAGE }}
    steps:
      - uses: actions/checkout@v6

      - name: Generate go.sum
        run: go mod tidy

      - name: Run tests
        run: go test -v -count=1 ./...

  vet:
    name: go vet
    runs-on: ubuntu-latest
    container: ${{ env.CI_IMAGE }}
    steps:
      - uses: actions/checkout@v6

      - name: Generate go.sum
        run: go mod tidy

      - run: go vet ./...
