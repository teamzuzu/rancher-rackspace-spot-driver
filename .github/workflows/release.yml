name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v1.2.3)"
        required: true
        type: string
      draft:
        description: "Publish as a draft release"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write       # create GitHub releases, upload assets, push tags, commit docs
  actions: write        # trigger the Deploy Docs workflow

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check version format
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${{ inputs.version }}"
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must match vMAJOR.MINOR.PATCH (e.g. v1.2.3), got: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  tag:
    name: Create git tag
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists — skipping (tag-push trigger)"
          else
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION"
          fi

  goreleaser:
    name: Build & publish binaries
    needs: [validate, tag]
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository }}-ci:latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.version }}

      - name: Run GoReleaser
        run: goreleaser release --clean ${{ inputs.draft && '--draft' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-docs:
    name: Build UI extension, package chart, update docs
    needs: [validate, tag, goreleaser]
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository }}-ci:latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install UI dependencies
        working-directory: ui
        run: npm install --legacy-peer-deps

      - name: Set extension version
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          VER="${VERSION#v}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VER}\"/" ui/pkg/rackspacespot/package.json

      - name: Build UI extension
        working-directory: ui
        run: npm run build-pkg rackspacespot

      - name: Copy extension files to docs
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          VER="${VERSION#v}"
          PLUGIN_DIR="docs/extensions/rackspacespot/${VER}/plugin"
          mkdir -p "${PLUGIN_DIR}"
          cp -r "ui/dist-pkg/rackspacespot-${VER}/." "${PLUGIN_DIR}/"
          # Generate files.txt listing all files under the versioned dir
          (cd "docs/extensions/rackspacespot/${VER}" && find . -type f | sed 's|^\./||' | sort) \
            > "docs/extensions/rackspacespot/${VER}/files.txt"

      - name: Get binary checksum
        id: checksum
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          mkdir -p /tmp/release-checksums
          curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/checksums.txt" \
            -o /tmp/release-checksums/checksums.txt
          CHECKSUM=$(grep "rancher-rackspace-spot-driver_linux_amd64.tar.gz" \
            /tmp/release-checksums/checksums.txt | awk '{print $1}')
          echo "amd64=${CHECKSUM}" >> "$GITHUB_OUTPUT"

      - name: Package Helm chart
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          VER="${VERSION#v}"
          REPO_OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          PAGES_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}"
          BINARY_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/rancher-rackspace-spot-driver_linux_amd64.tar.gz"
          CHECKSUM="${{ steps.checksum.outputs.amd64 }}"
          ENDPOINT="${PAGES_URL}/extensions/rackspacespot/${VER}"

          # Stamp release-specific values into chart files before packaging.
          # Patterns match any existing value so re-running a release never silently no-ops.
          sed -i "s|^\(  url:\) \"[^\"]*\"$|\1 \"${BINARY_URL}\"|" deploy/charts/rackspacespot/values.yaml
          sed -i "s|^\(  checksum:\) \"[^\"]*\"$|\1 \"${CHECKSUM}\"|" deploy/charts/rackspacespot/values.yaml
          sed -i "s|^\(  endpoint:\) \"[^\"]*\"$|\1 \"${ENDPOINT}\"|" deploy/charts/rackspacespot/values.yaml
          sed -i "s|^version:.*|version: \"${VER}\"|" deploy/charts/rackspacespot/Chart.yaml
          sed -i "s|^appVersion:.*|appVersion: \"${VERSION}\"|" deploy/charts/rackspacespot/Chart.yaml

          mkdir -p release_artifacts
          helm package deploy/charts/rackspacespot \
            --version "${VER}" \
            --app-version "${VERSION}" \
            --destination ./release_artifacts

      - name: Upload Helm chart to release
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          VER="${VERSION#v}"
          RELEASE_ID=$(curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/gzip" \
            --data-binary "@release_artifacts/rackspacespot-${VER}.tgz" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=rackspacespot-${VER}.tgz"

      - name: Update Helm repo index
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          CHART_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}"
          if [ -f docs/index.yaml ]; then
            helm repo index ./release_artifacts --merge docs/index.yaml --url "${CHART_URL}"
          else
            helm repo index ./release_artifacts --url "${CHART_URL}"
          fi
          cp ./release_artifacts/index.yaml ./docs/index.yaml

      - name: Update version references in README.md
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          sed -i "s|releases/download/v[0-9]\+\.[0-9]\+\.[0-9]\+/|releases/download/${VERSION}/|g" README.md
          sed -i "s|Replace \`v[0-9]\+\.[0-9]\+\.[0-9]\+\`|Replace \`${VERSION}\`|g" README.md

      - name: Commit and push changes
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          git add docs/extensions/ docs/index.yaml README.md \
                deploy/charts/rackspacespot/Chart.yaml \
                deploy/charts/rackspacespot/values.yaml \
                ui/pkg/rackspacespot/package.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: release ${VERSION} — extension files, chart index, README [skip ci]"
            git push origin main
          fi

      - name: Trigger docs site rebuild
        run: |
          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
