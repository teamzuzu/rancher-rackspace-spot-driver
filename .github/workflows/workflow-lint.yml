name: Lint Workflows

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository }}-ci:latest
    steps:
      - uses: actions/checkout@v6

      - name: Run actionlint
        run: actionlint -color .github/workflows/*.yml
